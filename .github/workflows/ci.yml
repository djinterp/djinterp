# djinterp - .github/workflows/ci.yml
#
#   On every push to main and every pull request: the merge window's gates
# over what the push or the request changed (the ladder and the style over the
# changed files, the fixed-width includes, the C runtime's calls MSVC refuses,
# single hyphens in prose, each folder's kinds of file, the roots' growth, the
# version, and no lane named in an added line or a commit message), then a
# build and the tests that need no server, with GCC, Clang and MSVC; and, with
# GCC and Clang, the suites labelled needs-server against real servers:
# PostgreSQL and MariaDB as service containers, MongoDB's replica set and
# standalone server started by scripts/ci/mongodb_up.sh.
#   One run says every failure it can: each gate runs whatever an earlier gate
# found, the build keeps going past a unit that fails, and the tests run over
# whatever was built (a test whose program didn't build fails as not run).
#   The Windows job doesn't fail the run until it has passed once.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: djinterp

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          echo "rev=$base" >> "$GITHUB_OUTPUT"
          git log --format='%B' "$base..HEAD" > "$RUNNER_TEMP/messages.txt"

      - name: the ladder over the changed units
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/ladder.py
          --changed "${{ steps.base.outputs.rev }}"
          --known scripts/ci/ladder_known.txt

      - name: the style of the changed files
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/check_style.py
          --changed "${{ steps.base.outputs.rev }}"
          --known scripts/ci/style_known.txt

      - name: the fixed-width includes
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/check_stdint_includes.py
          --known scripts/ci/stdint_known.txt

      - name: the C runtime's calls MSVC refuses
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/check_crt_calls.py
          --known scripts/ci/crt_known.txt

      - name: single hyphens in prose
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: python3 -I scripts/ci/check_hyphens.py

      - name: each folder's kinds of file
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: python3 -I scripts/ci/check_file_kinds.py

      - name: the roots only grow
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/check_root_growth.py
          --base "${{ steps.base.outputs.rev }}"

      - name: the version
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: python3 -I scripts/ci/check_version.py

      - name: no lane named
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >
          python3 -I scripts/ci/check_lane_names.py
          --base "${{ steps.base.outputs.rev }}"
          --message "$RUNNER_TEMP/messages.txt"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # keep: the native tool's keep-going switch (MSBuild keeps going)
          - { name: gcc,   os: ubuntu-24.04, cc: gcc,   cxx: g++,     keep: -k }
          - { name: clang, os: ubuntu-24.04, cc: clang, cxx: clang++, keep: -k }
          - { name: msvc,  os: windows-2022, cc: cl,    cxx: cl,      keep: '' }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'msvc' }}
    steps:
      - uses: actions/checkout@v4

      - name: the outside libraries
        if: runner.os == 'Linux'
        working-directory: .
        env:
          # with GCC, MinGW-w64 too: the file tree's leaf compiles its
          # Windows backend with it, as C++17 and C++20
          MORE: ${{ matrix.name == 'gcc' && 'g++-mingw-w64-x86-64-posix' || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev \
                                  libssh2-1-dev zlib1g-dev $MORE

      - name: configure
        id: configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S build/cmake/config -B "$RUNNER_TEMP/build"
          -DCMAKE_BUILD_TYPE=Debug -DDJINTERP_MEM_TALLY=ON

      - name: build
        env:
          KEEP: ${{ matrix.keep }}
        run: >
          cmake --build "$RUNNER_TEMP/build" --config Debug --parallel 4
          ${KEEP:+-- $KEEP}

      - name: test
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: >
          ctest --test-dir "$RUNNER_TEMP/build" -C Debug
          --label-exclude needs-server --output-on-failure --parallel 4
          --timeout 600

  servers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,   cc: gcc,   cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    name: servers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: djinterp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: djinterp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DJINTERP_TEST_POSTGRES_HOST: 127.0.0.1
      DJINTERP_TEST_POSTGRES_PORT: 5432
      DJINTERP_TEST_POSTGRES_USER: postgres
      DJINTERP_TEST_POSTGRES_PASSWORD: djinterp
      DJINTERP_TEST_POSTGRES_DATABASE: postgres
      DJINTERP_TEST_MARIADB_HOST: 127.0.0.1
      DJINTERP_TEST_MARIADB_PORT: 3306
      DJINTERP_TEST_MARIADB_USER: root
      DJINTERP_TEST_MARIADB_PASSWORD: djinterp
    steps:
      - uses: actions/checkout@v4

      - name: the clients and the outside libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmariadb-dev libmongoc-dev \
                                  libbson-dev libssl-dev zlib1g-dev

      - name: MongoDB, a replica set and a standalone server
        run: bash scripts/ci/mongodb_up.sh 8.0 >> "$GITHUB_ENV"

      - name: configure
        id: configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S build/cmake/config -B "$RUNNER_TEMP/build"
          -DCMAKE_BUILD_TYPE=Debug -DDJINTERP_MEM_TALLY=ON

      - name: build the suites that need a server
        run: |
          targets=$(ctest --test-dir "$RUNNER_TEMP/build" -N -L needs-server |
                    sed -n 's/^ *Test *#[0-9]*: *//p')
          echo "$targets"
          test -n "$targets"
          cmake --build "$RUNNER_TEMP/build" --config Debug --parallel 4 \
                --target $targets

      - name: test against the servers
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: >
          ctest --test-dir "$RUNNER_TEMP/build" -C Debug
          --label-regex needs-server --output-on-failure --parallel 2
          --timeout 600
